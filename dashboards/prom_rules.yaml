groups:
- name: carbon-aware-rules
  interval: 15s
  rules:
  - record: region:carbon_intensity:avg5m
    expr: avg_over_time(region_ci_gco2_kwh[5m])
  - alert: HighCO2
    expr: plan_co2_estimate_kg > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Planned CO₂ exceeds 10kg"
  - alert: MigrationSpike
    expr: increase(migration_event_total[10m]) > 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Migration count spiked in last 10m"
